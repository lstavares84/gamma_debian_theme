<script>
const q=new URLSearchParams(location.search); const N=+q.get('n')||1, W=+q.get('w')||1272, H=+q.get('h')||2772;

 okf:'#0A300C',waf:'#3C2C00',ndf:'#081209',ndb:'#1E341E',nef:'#081C0A',neb:'#40783C',mesh:'#0A1A0B',grid:'#0E2410',mid:'#2E6A2A',low:'#173417'};
const svg=document.createElementNS(NS,'svg');svg.setAttribute('width',W);svg.setAttribute('height',H);
svg.setAttribute('viewBox',`0 0 ${VW} ${VH}`);svg.setAttribute('preserveAspectRatio','xMidYMid slice');document.body.appendChild(svg);
function add(tag,a,txt,parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;(parent||svg).appendChild(e);return e}
function P(cx,cy,r,rot=0){const o=[];for(let i=0;i<6;i++){const a=(-90+60*i+rot)*Math.PI/180;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return o}
const pstr=p=>p.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' ');
const G=(c,b=7)=>`filter:drop-shadow(0 0 ${b}px ${c}99) drop-shadow(0 0 ${b*3}px ${c}2e)`;

let seed=N*104729+7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

// fundo + malha de hexágonos (raio 22: o dobro do desktop, por causa da densidade 450)

[[w0/2,r0],[0,2.5*r0],[w0,2.5*r0],[0,-0.5*r0],[w0,-0.5*r0]].forEach(([x,y])=>add('polygon',{points:pstr(P(x,y,r0)),fill:'none',stroke:C.mesh,'stroke-width':1.6},null,pat));

const S={
1(){ // Sentinela

  hex(cx,cy,180,'none',C.neb,2).setAttribute('stroke-dasharray','9 12');
  for(let i=0;i<6;i++){const t=(-90+60*i)*Math.PI/180; add('line',{x1:cx+408*Math.cos(t),y1:cy+408*Math.sin(t),x2:cx+450*Math.cos(t),y2:cy+450*Math.sin(t),stroke:C.neb,'stroke-width':2.6})}

2(){ // Varredura

  for(let a=0;a<360;a+=5){const t=(a-90)*Math.PI/180,r2=a%30==0?R+30:R+14; add('line',{x1:cx+R*Math.cos(t),y1:cy+R*Math.sin(t),x2:cx+r2*Math.cos(t),y2:cy+r2*Math.sin(t),stroke:a%30==0?C.neb:C.dim,'stroke-width':1.8})}
  [0,90,180,270].forEach(a=>{const t=(a-90)*Math.PI/180;T(cx+(R+66)*Math.cos(t),cy+(R+66)*Math.sin(t)+9,a+'°',{a:'middle',c:C.sub,z:22})});
  const sweep=58; for(let i=0;i<40;i++){const a1=(sweep-i*1.1-90)*Math.PI/180,a2=(sweep-(i+1)*1.1-90)*Math.PI/180;
    add('path',{d:`M${cx} ${cy}L${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}A${R} ${R} 0 0 0 ${cx+R*Math.cos(a2)} ${cy+R*Math.sin(a2)}Z`,fill:C.acc,opacity:(.16*(1-i/40)).toFixed(3)})}

4(){ // Contagem regressiva

  '000137'.split('').forEach((d,i)=>{const lead=i<3; T(x0+i*dw+dw/2,y,d,{a:'middle',c:lead?C.dim:C.white,z:270,w:500,st:lead?'':G(C.acc,10)})});

  for(let j=0;j<30;j++)for(let i=-1;i<12;i++){const x=i*sx+(j%2)*sx/2, y=j*sy; const k=lit[i+','+j], d=Math.hypot(x-cx,y-cy), op=Math.max(0,1-d/760);

6(){ // Cifra
  const ab='ABCDEFGHIJKLMNOPQRSTUVWXYZ', cw=22.8, lh=46, R=500, x0=40, y0=720;
  const g=add('g',{style:'font:400 36px JetBrains Mono'});
