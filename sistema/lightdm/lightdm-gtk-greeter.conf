# Arquivo: sistema/lightdm/lightdm-gtk-greeter.conf
# Projeto: GAMMA Debian (tema Contador)
# Versão: 1.0.0
# Data e hora: 21/11/2026 22:30 (America/Sao_Paulo)
# Autoria: lstavares84, com Claude Opus 5.5 (Anthropic). Criação original.
# Vai para /etc/lightdm/lightdm-gtk-greeter.conf (o original fica no backup).
# Opções documentadas em /usr/share/doc/lightdm-gtk-greeter/ (arquivo de exemplo).
[greeter]
theme-name=GAMMA-Login
icon-theme-name=Papirus-Dark
cursor-theme-name=GAMMA-cursor
cursor-theme-size=32
font-name=Roboto 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
background=/usr/share/backgrounds/gamma-login/fundo-3440x1440.png
user-background=false
hide-user-image=true
position=50%,center 44%,center
indicators=~spacer;~clock;~spacer;~power
clock-format=TERMINAL 07  //  %d.%m.%Y  %H:%M:%S
active-monitor=DP-2;#cursor
screensaver-timeout=60

# fundo próprio para cada monitor (nomes do xrandr)
[monitor: DP-2]
background=/usr/share/backgrounds/gamma-login/fundo-3440x1440.png

[monitor: DP-4]
background=/usr/share/backgrounds/gamma-login/fundo-2560x1080.png
